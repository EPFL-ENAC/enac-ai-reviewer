# Default values for the enac-ai-reviewer chart.
# Override using a custom values file or --set flags during helm install/upgrade.

nameOverride: ""
fullnameOverride: ""

global:
  imagePullSecrets: []
  # - name: ghcr-creds

# One image, two commands (PRD): both web and worker Deployments below run
# this same image, differing only by their container `args` (["web"] /
# ["worker"]). Overridden per-env by ArgoCD with the real digest/tag from CI.
image:
  # ghcr.io/<gh-owner-lowercased>/<org>/<repo>, where <org> matches the `ORG`
  # input in .github/workflows/deploy.yml. Confirmed: org = epfl-enac.
  repository: ghcr.io/epfl-enac/epfl-enac/enac-ai-reviewer
  tag: "latest"
  pullPolicy: IfNotPresent

web:
  enabled: true
  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
    annotations: {}

  # GITHUB_BOT_LOGIN and ALLOWED_ORGANIZATIONS are not sensitive (public
  # GitHub usernames / org logins) so they are grouped here rather than in
  # a Secret. ALLOWED_ORGANIZATIONS is a comma-separated list of GitHub org
  # logins (e.g. "EPFL-ENAC"), matching src/domain/config.ts.
  env:
    GITHUB_BOT_LOGIN: "enac-ai-reviewer"
    ALLOWED_ORGANIZATIONS: "EPFL-ENAC"
    # The admin UI is served by the same web process. Authentication can be
    # handled either by an organisation proxy (ADMIN_AUTH_MODE=proxy) or
    # directly through Keycloak OIDC (ADMIN_AUTH_MODE=keycloak).
    # TRUST_PROXY must be "true" when the app is accessed through an
    # ingress/reverse proxy.
    ADMIN_AUTH_ENABLED: "true"
    ADMIN_AUTH_MODE: "keycloak" # "proxy" or "keycloak"
    #ADMIN_AUTH_HEADER_USER: "X-Auth-Request-User"
    #ADMIN_AUTH_HEADER_EMAIL: "X-Auth-Request-Email"
    KEYCLOAK_REDIRECT_URI: "https://enac-ai-reviewer.epfl.ch/admin/auth/callback"
    TRUST_PROXY: "true"

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # The web process validates webhooks and also checks that the triggering
  # actor is a member of an allowed organization, which requires the GitHub
  # App's credentials (see src/web/github-webhook.ts). LLM_API_KEY is still
  # never given to the web pod.
  existingSecret:
    enabled: true
    name: "" # REQUIRED when enabled=true: name of the pre-existing Secret
    keys:
      githubWebhookSecretKey: GITHUB_WEBHOOK_SECRET
      githubAppIdKey: GITHUB_APP_ID
      githubPrivateKeyKey: GITHUB_PRIVATE_KEY
      keycloakUrlKey: KEYCLOAK_URL
      keycloakRealmKey: KEYCLOAK_REALM
      keycloakClientIdKey: KEYCLOAK_CLIENT_ID
      keycloakClientSecretKey: KEYCLOAK_CLIENT_SECRET
      sessionSecretKey: SESSION_SECRET
      sessionSaltKey: SESSION_SALT

  # Chart-managed fallback when existingSecret.enabled=false (e.g. local/dev).
  secrets:
    GITHUB_WEBHOOK_SECRET: ""
    GITHUB_APP_ID: ""
    GITHUB_PRIVATE_KEY: ""
    KEYCLOAK_URL: ""
    KEYCLOAK_REALM: ""
    KEYCLOAK_CLIENT_ID: ""
    KEYCLOAK_CLIENT_SECRET: ""
    SESSION_SECRET: ""
    SESSION_SALT: ""

worker:
  enabled: true
  replicaCount: 1

  # No Service/Ingress ever selects the worker — it must not be publicly
  # exposed (PRD §5).
  env:
    GITHUB_BOT_LOGIN: "enac-ai-reviewer"
    LLM_BASE_URL: "https://inference.rcp.epfl.ch/v1"
    LLM_MODEL: "Qwen/Qwen3.6-35B-A3B"

  heartbeatFile: /tmp/worker-heartbeat

  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi

  # Exec probes on a heartbeat file the worker loop touches every poll tick —
  # proves the poll loop is actually making progress, not just that the
  # process exists. See helm/templates/worker-deployment.yaml.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    freshnessSeconds: 30

  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  nodeSelector: {}
  tolerations: []
  affinity: {}

  existingSecret:
    enabled: true
    name: ""
    keys:
      githubAppIdKey: GITHUB_APP_ID
      githubPrivateKeyKey: GITHUB_PRIVATE_KEY
      llmApiKeyKey: LLM_API_KEY

  secrets:
    GITHUB_APP_ID: ""
    GITHUB_PRIVATE_KEY: ""
    LLM_API_KEY: ""

# -----------------------------------------------------------------------------
# Database: shared by web, worker, and the migration job. Env var name matches
# src/domain/config.ts exactly (DATABASE_URL).
# Either use the embedded Postgres (recommended for small deployments) or
# provide your own pre-existing Secret with a DATABASE_URL key.
# -----------------------------------------------------------------------------
database:
  # Embedded PostgreSQL for small / self-contained deployments.
  postgresql:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: "17.5.0"
      pullPolicy: IfNotPresent
    auth:
      username: enac_ai
      database: enac_ai_reviewer
      # Plain-text password (simple, but not recommended for GitOps).
      # Only used when postgresql.enabled=true and existingSecret.name is empty.
      password: ""
    persistence:
      enabled: true
      size: 5Gi
      # Leave empty to use the cluster default storage class.
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      port: 5432

  # Pre-existing Secret that contains the database credentials.
  # When postgresql.enabled=true and this name is set, the chart expects the
  # Secret to contain both:
  #   - a key matching keys.password (for the Postgres container)
  #   - a key matching keys.url      (for the app / migration job)
  # When postgresql.enabled=false, only keys.url is required.
  existingSecret:
    name: ""
    keys:
      url: DATABASE_URL
      password: POSTGRES_PASSWORD
  waitForPostgres:
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: "17.5.0"
      pullPolicy: IfNotPresent

migrations:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  waitForPostgres:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # GitHub PR diffs can be large; bump further if 413s show up in
    # webhook_rejected_total.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  host: "enac-ai-reviewer.epfl.ch" # TODO: replace with the real hostname once assigned
  tls: []
  # The /admin UI is exposed through a separate Ingress so that authentication
  # proxy annotations can be applied only to the admin path. The GitHub webhook
  # path above must stay publicly reachable and unauthenticated.
  admin:
    enabled: true
    path: /admin
    pathType: Prefix
    annotations: {}
    # Example using an in-cluster OAuth2 Proxy:
    # annotations:
    #   nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth"
    #   nginx.ingress.kubernetes.io/auth-signin: "https://auth.example.com/oauth2/start?rd=$escaped_request_uri"

serviceAccount:
  create: true
  annotations: {}
  name: ""
  imagePullSecrets: []

# Egress-focused (unlike co2-calculator's ingress-from-routes policies):
# web may only reach Postgres, worker may only reach Postgres/GitHub/the LLM
# gateway. Off by default so it doesn't fight an unknown cluster CNI; turn on
# once verified against the target cluster.
networkPolicies:
  enabled: false
  # Ingress source allowed to reach the web Service (typically the ingress
  # controller's namespace). Example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFromController: []
  # Egress destination for Postgres. Example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: postgres
  postgresEgress: []
