{{- if not .Values.web.existingSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enac-ai-reviewer.fullname" . }}-web
  labels:
    {{- include "enac-ai-reviewer.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
type: Opaque
stringData:
  GITHUB_WEBHOOK_SECRET: {{ required "web.secrets.GITHUB_WEBHOOK_SECRET must be set, or use web.existingSecret.enabled=true." .Values.web.secrets.GITHUB_WEBHOOK_SECRET | quote }}
  GITHUB_APP_ID: {{ required "web.secrets.GITHUB_APP_ID must be set, or use web.existingSecret.enabled=true." .Values.web.secrets.GITHUB_APP_ID | quote }}
  GITHUB_PRIVATE_KEY: {{ required "web.secrets.GITHUB_PRIVATE_KEY must be set, or use web.existingSecret.enabled=true." .Values.web.secrets.GITHUB_PRIVATE_KEY | quote }}
  {{- if eq .Values.web.env.ADMIN_AUTH_MODE "keycloak" }}
  KEYCLOAK_URL: {{ required "web.secrets.KEYCLOAK_URL must be set when ADMIN_AUTH_MODE=keycloak, or use web.existingSecret.enabled=true." .Values.web.secrets.KEYCLOAK_URL | quote }}
  KEYCLOAK_REALM: {{ required "web.secrets.KEYCLOAK_REALM must be set when ADMIN_AUTH_MODE=keycloak, or use web.existingSecret.enabled=true." .Values.web.secrets.KEYCLOAK_REALM | quote }}
  KEYCLOAK_CLIENT_ID: {{ required "web.secrets.KEYCLOAK_CLIENT_ID must be set when ADMIN_AUTH_MODE=keycloak, or use web.existingSecret.enabled=true." .Values.web.secrets.KEYCLOAK_CLIENT_ID | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ required "web.secrets.KEYCLOAK_CLIENT_SECRET must be set when ADMIN_AUTH_MODE=keycloak, or use web.existingSecret.enabled=true." .Values.web.secrets.KEYCLOAK_CLIENT_SECRET | quote }}
  SESSION_SECRET: {{ required "web.secrets.SESSION_SECRET must be set when ADMIN_AUTH_MODE=keycloak, or use web.existingSecret.enabled=true." .Values.web.secrets.SESSION_SECRET | quote }}
  {{- if .Values.web.secrets.SESSION_SALT }}
  SESSION_SALT: {{ .Values.web.secrets.SESSION_SALT | quote }}
  {{- end }}
  {{- end }}
{{- end }}
