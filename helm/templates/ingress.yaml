{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enac-ai-reviewer.fullname" . }}
  labels:
    {{- include "enac-ai-reviewer.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only /webhooks/github is exposed externally. /healthz and
          # /metrics stay in-cluster (kubelet probes, scraping) — PRD §5/§17.
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: {{ include "enac-ai-reviewer.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
