{{- if not .Values.worker.existingSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enac-ai-reviewer.fullname" . }}-worker
  labels:
    {{- include "enac-ai-reviewer.componentLabels" (dict "ctx" . "component" "worker") | nindent 4 }}
type: Opaque
stringData:
  GITHUB_APP_ID: {{ required "worker.secrets.GITHUB_APP_ID must be set, or use worker.existingSecret.enabled=true." .Values.worker.secrets.GITHUB_APP_ID | quote }}
  GITHUB_PRIVATE_KEY: {{ required "worker.secrets.GITHUB_PRIVATE_KEY must be set, or use worker.existingSecret.enabled=true." .Values.worker.secrets.GITHUB_PRIVATE_KEY | quote }}
  LLM_API_KEY: {{ required "worker.secrets.LLM_API_KEY must be set, or use worker.existingSecret.enabled=true." .Values.worker.secrets.LLM_API_KEY | quote }}
  LLM_MODEL: {{ required "worker.secrets.LLM_MODEL must be set, or use worker.existingSecret.enabled=true." .Values.worker.secrets.LLM_MODEL | quote }}
  {{- if .Values.worker.env.VIKING_BASE_URL }}
  VIKING_API_KEY: {{ required "worker.secrets.VIKING_API_KEY must be set when worker.env.VIKING_BASE_URL is set, or use worker.existingSecret.enabled=true." .Values.worker.secrets.VIKING_API_KEY | quote }}
  {{- end }}
  {{- if .Values.worker.env.OTEL_EXPORTER_OTLP_ENDPOINT }}
  {{- if .Values.worker.secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.worker.secrets.OTEL_EXPORTER_OTLP_HEADERS | quote }}
  {{- end }}
  {{- end }}
{{- end }}
