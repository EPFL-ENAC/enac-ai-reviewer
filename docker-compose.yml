services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: enac_ai
      POSTGRES_PASSWORD: enac_ai
      POSTGRES_DB: enac_ai_reviewer
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enac_ai']
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pg-data:
