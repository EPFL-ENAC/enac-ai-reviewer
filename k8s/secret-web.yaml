# PLACEHOLDER — no real values here.
#
# PRD §17 is explicit that the web pod may only ever see these three keys and
# must never see LLM_API_KEY or GITHUB_PRIVATE_KEY. This Secret enforces that
# split at the manifest level: ai-review-web's Deployment only references
# this Secret, never ai-review-worker-secrets.
#
# TODO(secrets-management): this repo has no established convention yet for
# how real secret values reach the cluster. A sibling app (co2-calculator)
# uses Helm's `existingSecret` pattern — i.e. it does NOT template real
# values at all; ops/ArgoCD provisions the actual Secret object out-of-band
# (see co2-calculator/helm/values.yaml `database.existingSecret`,
# `backend.existingSecret`) and the chart only references it by name. No
# sealed-secrets or external-secrets controller was found installed/referenced
# anywhere under /home/guilbert. Until ENAC-IT confirms a mechanism, treat
# this file as documentation of the required *shape* of the Secret, apply it
# once with real values via `kubectl create secret generic --dry-run ... |
# kubectl apply -f -` (or edit in place, never commit real values here), or
# swap to referencing a pre-existing, out-of-band-provisioned Secret the way
# co2-calculator does.
apiVersion: v1
kind: Secret
metadata:
  name: ai-review-web-secrets
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-web
    app.kubernetes.io/part-of: enac-ai-reviewer
type: Opaque
stringData:
  {}
  # GITHUB_WEBHOOK_SECRET: ""
  # DATABASE_URL: ""
  # ALLOWED_REPOSITORIES: ""   # comma-separated, e.g. "EPFL-ENAC/co2-calculator"
  #
  # NOTE: ALLOWED_REPOSITORIES isn't itself sensitive, it's grouped into this
  # Secret only because PRD §17 lists it alongside the web pod's other two
  # vars without splitting out a ConfigMap. Safe to move to a ConfigMap later
  # with zero security implications if that's preferred.
  #
  # GITHUB_BOT_LOGIN is also required by src/domain/config.ts webSchema but
  # is not sensitive (a public username, PRD §10), so it's set as a plain
  # literal env var in deployment-web.yaml instead of living here.
