# Selecting a pod with policyTypes [Ingress, Egress] and only listing these
# rules makes everything else default-deny for that pod (standard
# NetworkPolicy semantics) — no separate "default-deny-all" policy is needed
# on top of this one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-review-web
  namespace: enac-ai-reviewer
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-review-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # ADJUST: namespace/pod labels of the actual ingress controller on the
    # ENAC cluster. "ingress-nginx" is a common default namespace name but
    # was not confirmed against any cluster config found on this machine.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Postgres. ADJUST: this assumes Postgres runs in-cluster in this same
    # namespace with the Bitnami chart's conventional label (matches how
    # co2-calculator's skaffold.yaml deploys bitnami/postgresql). If ENAC's
    # Postgres is an external/managed instance instead, replace this
    # podSelector with an `ipBlock: { cidr: <db-host>/32 }` egress rule.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # DNS — required for any of the above to resolve; easy to forget and a
    # common cause of "NetworkPolicy broke everything" incidents.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
