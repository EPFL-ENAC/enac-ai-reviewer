# Exposes exactly one path externally: /webhooks/github. /healthz and
# /metrics on the same Service are reachable inside the cluster (kubelet
# probes, in-cluster scraping) but are NOT reachable through this Ingress —
# an nginx-ingress controller with `pathType: Exact` on a single explicit
# path matches only that literal path and 404s everything else at this host,
# so no rewrite/regex trickery is needed to scope this tightly; a single
# Prefix path already contains nothing else. If the ENAC cluster fronts this
# with OpenShift Routes instead of ingress-nginx (see co2-calculator's
# routes.yaml for that pattern), this file needs a route.openshift.io/v1
# Route equivalent instead — not written here since PRD §5/§17 asks for
# "Ingress" specifically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-review-web
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: enac-ai-reviewer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    # GitHub webhook deliveries can be a few hundred KB for large diffs on
    # pull_request events; default nginx body size limits are usually fine
    # but bump if 413s show up in webhook_rejected_total.
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
spec:
  # ADJUST: "nginx" matches the class used by the sibling co2-calculator app
  # (see co2-calculator/helm/values.yaml `ingress.className`) — confirm this
  # is also correct for wherever enac-ai-reviewer is actually scheduled.
  ingressClassName: nginx
  rules:
    - host: enac-ai-reviewer.epfl.ch # TODO: replace with the real hostname once assigned
      http:
        paths:
          - path: /webhooks/github
            pathType: Exact
            backend:
              service:
                name: ai-review-web
                port:
                  name: http
