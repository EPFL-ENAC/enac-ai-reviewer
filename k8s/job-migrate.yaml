# Job, not an initContainer, and specifically not on either Deployment's pod
# spec. Reasoning:
#   - An initContainer runs on every pod start/restart. With 2 web replicas +
#     1 worker replica, any rolling update or crash-loop would fire the
#     migration command up to 3 times concurrently — node-pg-migrate isn't
#     designed for concurrent runners racing over the same migrations table
#     without extra locking, so this trades a cheap, well-understood problem
#     (run migrations once, wait, then roll out) for a rare-but-real one
#     (concurrent schema migration races).
#   - A single Job run once before `kubectl apply` / rollout of the two
#     Deployments decouples "did the schema change" from "did a pod happen to
#     restart", which is the property we actually want.
#
# node-pg-migrate lives in "dependencies" (not devDependencies) specifically
# so it survives the Dockerfile runtime stage's `pnpm install --prod`, making
# `pnpm migrate` available in enac-ai-reviewer:latest for this Job to run.
#
# CI/re-run note: Jobs are immutable once created, so re-applying this file
# unchanged on a second deploy will error (`kubectl apply` can't update an
# existing Job's podTemplate). Until a CI pipeline exists (Phase 0 says
# GitHub Actions is planned but not built yet), either `kubectl delete
# job/ai-review-migrate -n enac-ai-reviewer --ignore-not-found` immediately
# before `kubectl apply -k .` in the deploy step, or have CI suffix this
# Job's name with the image tag/commit SHA (e.g. via kustomize
# `nameSuffix`/a generated overlay) so each release gets a fresh Job object.
# NetworkPolicy note: this Job's pods carry app.kubernetes.io/name:
# ai-review-migrate, which neither networkpolicy-web.yaml nor
# networkpolicy-worker.yaml selects. Per NetworkPolicy semantics, a pod not
# selected by any policy keeps the namespace's default (this base defines no
# namespace-wide default-deny), so the migration Job gets unrestricted
# egress/ingress and can reach Postgres without a dedicated policy. Add one
# if a cluster-wide default-deny policy is ever introduced upstream of this
# base.
apiVersion: batch/v1
kind: Job
metadata:
  name: ai-review-migrate
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: enac-ai-reviewer
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-review-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: enac-ai-reviewer:latest # see deployment-web.yaml re: CI image tagging
          imagePullPolicy: IfNotPresent
          # Matches the "migrate" script in package.json. See the CAUTION
          # block above — this currently won't run against the Dockerfile's
          # --prod-only runtime stage until that gap is fixed.
          command: ['pnpm', 'migrate']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Deliberately reusing the web secret's DATABASE_URL key
                  # rather than inventing a third Secret — DATABASE_URL is
                  # identical for web/worker/migrate, it's not sensitive in a
                  # web-vs-worker sense, and both existing secrets already
                  # carry a copy of it per PRD §17.
                  name: ai-review-web-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
