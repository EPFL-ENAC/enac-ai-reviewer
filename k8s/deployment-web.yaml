apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-review-web
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: enac-ai-reviewer
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-review-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-review-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: enac-ai-reviewer
    spec:
      # web must never mount GITHUB_PRIVATE_KEY / LLM_API_KEY — this is a
      # hard PRD §17 requirement, not a style choice. Only ai-review-web-secrets
      # is referenced anywhere in this pod spec. Do not add envFrom/env
      # entries pointing at ai-review-worker-secrets here.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # CI publishes the real tag (git sha / semver) and rewrites this via
          # the kustomization.yaml `images:` transformer, e.g.:
          #   kustomize edit set image enac-ai-reviewer=ghcr.io/epfl-enac/enac-ai-reviewer:<sha>
          image: enac-ai-reviewer:latest
          imagePullPolicy: IfNotPresent
          # Confirmed against the repo's actual Dockerfile: ENTRYPOINT is
          # ["node", "dist/entrypoint.js"], CMD (default arg) is ["web"].
          # Setting args explicitly here for clarity even though "web" is
          # already the image default.
          args: ['web']
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # PORT is not secret; src/domain/config.ts defaults it to 3000
            # already, this just makes the assumption explicit and pins it
            # in case that default ever changes. Confirm 3000 stays correct
            # once src/web/server.ts actually calls fastify.listen().
            - name: PORT
              value: '3000'
            # Not secret (PRD §10: a public GitHub username). Fixed org-wide
            # constant, not per-environment, so it's a literal here rather
            # than living in a Secret or ConfigMap.
            - name: GITHUB_BOT_LOGIN
              value: enac-ai-reviewer
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ai-review-web-secrets
                  key: GITHUB_WEBHOOK_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-review-web-secrets
                  key: DATABASE_URL
            - name: ALLOWED_REPOSITORIES
              valueFrom:
                secretKeyRef:
                  name: ai-review-web-secrets
                  key: ALLOWED_REPOSITORIES
          # ASSUMPTION: /healthz on port 3000. src/web/server.ts does not
          # exist yet (Phase 2); PRD §16 only mandates /metrics, but
          # IMPLEMENTATION_PLAN.md Phase 2 explicitly calls out /healthz too.
          # Reconcile this path/port once the Fastify server is implemented.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            # Placeholder sizing — this is a thin webhook-intake process
            # (validate HMAC, dedupe, insert one row, return 202), tune once
            # real traffic/memory numbers exist.
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem needs a writable /tmp for Node/Fastify.
        - name: tmp
          emptyDir: {}
