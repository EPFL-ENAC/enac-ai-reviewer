# PLACEHOLDER — no real values here. See secret-web.yaml for the full note
# on secrets provisioning (no sealed-secrets/external-secrets convention
# found under /home/guilbert; co2-calculator's Helm chart instead relies on
# an out-of-band, pre-existing Secret via `existingSecret`).
#
# This Secret carries the sensitive worker-only credentials (GITHUB_PRIVATE_KEY,
# LLM_API_KEY) that ai-review-web must never mount, per PRD §17/§11.
apiVersion: v1
kind: Secret
metadata:
  name: ai-review-worker-secrets
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-worker
    app.kubernetes.io/part-of: enac-ai-reviewer
type: Opaque
stringData:
  {}
  # DATABASE_URL: ""
  # GITHUB_APP_ID: ""
  # GITHUB_PRIVATE_KEY: ""   # PEM, multi-line — safe in stringData as a block scalar
  # LLM_BASE_URL: ""         # e.g. https://inference.rcp.epfl.ch/v1
  # LLM_API_KEY: ""
  # LLM_MODEL: ""            # e.g. Qwen/Qwen3.6-35B-A3B
  #
  # GITHUB_BOT_LOGIN is also required by src/domain/config.ts workerSchema
  # (needed to recognize the bot's own prior comments) but is not sensitive,
  # so it's set as a plain literal env var in deployment-worker.yaml instead
  # of living here. ALLOWED_REPOSITORIES is web-only: the web process filters
  # by allowlist before a job is ever enqueued, so the worker doesn't need it.
