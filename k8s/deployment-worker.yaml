apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-review-worker
  namespace: enac-ai-reviewer
  labels:
    app.kubernetes.io/name: ai-review-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: enac-ai-reviewer
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-review-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-review-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: enac-ai-reviewer
    spec:
      # No Service/Ingress ever selects this pod — the worker must not be
      # publicly exposed (PRD §5). No ports are declared below, and the
      # NetworkPolicy in networkpolicy-worker.yaml denies all ingress.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: enac-ai-reviewer:latest # see deployment-web.yaml comment re: CI image tagging
          imagePullPolicy: IfNotPresent
          args: ['worker']
          env:
            # Not secret (PRD §10: a public GitHub username). Worker needs it
            # to recognize its own prior comments (anti-spam dedupe in Phase 4).
            - name: GITHUB_BOT_LOGIN
              value: enac-ai-reviewer
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: DATABASE_URL
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: GITHUB_APP_ID
            - name: GITHUB_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: GITHUB_PRIVATE_KEY
            - name: LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: LLM_BASE_URL
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: LLM_API_KEY
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: ai-review-worker-secrets
                  key: LLM_MODEL
            - name: WORKER_HEARTBEAT_FILE
              value: /tmp/worker-heartbeat
          # DESIGN CHOICE: the worker has no HTTP port in v1 (PRD §5 says it
          # must not be publicly exposed, and there's no other reason to bind
          # one). Two options were considered for probing it:
          #   (a) exec a "is the node process still running" check (e.g.
          #       `pgrep node`) — rejected: proves the process exists, not
          #       that the poll loop (IMPLEMENTATION_PLAN.md Phase 3,
          #       "poll loop 1-2s interval") is actually making progress. A
          #       hung event loop or a wedged DB connection would still pass.
          #   (b) exec a heartbeat-file freshness check — chosen. The worker
          #       loop must `touch` (or write the current timestamp to)
          #       WORKER_HEARTBEAT_FILE on every poll iteration; the probe
          #       fails if that file is missing or older than ~2x the poll
          #       interval, which actually proves liveness of the loop itself.
          # TODO(worker.ts, Phase 3): implement the touch — this file does
          # not exist yet since src/worker/worker.ts hasn't been written.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  test -f "$WORKER_HEARTBEAT_FILE" &&
                  [ "$(( $(date +%s) - $(stat -c %Y "$WORKER_HEARTBEAT_FILE") ))" -lt 30 ]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Looser than liveness: only requires the heartbeat file to exist
            # at all, so the pod is marked Ready once the worker loop starts
            # (gates rollout promotion) without flapping NotReady between
            # ordinary poll ticks.
            exec:
              command:
                - sh
                - -c
                - test -f "$WORKER_HEARTBEAT_FILE"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          resources:
            # Placeholder sizing — LLM calls are I/O-bound network requests,
            # not CPU heavy; tune once real job durations exist.
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
